name: byshree

services:
  postgres:
    image: postgres:15-alpine
    container_name: byshree-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: byshree
      POSTGRES_PASSWORD: byshree_dev
      POSTGRES_DB: byshree
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byshree -d byshree"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: byshree-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: byshree-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: byshree_meili_dev_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - ./docker-data/meilisearch:/meili_data

  minio:
    image: minio/minio:latest
    container_name: byshree-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: byshree
      MINIO_ROOT_PASSWORD: byshree_dev_minio
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - ./docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: byshree-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 byshree byshree_dev_minio &&
      mc mb -p local/byshree-media || true &&
      mc anonymous set download local/byshree-media || true &&
      echo 'minio bucket ready';
      "
